<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sage - The Little Herb Garden</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="sage.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo-link" aria-label="Back to homepage">
            <img class="logo" src="images/logo.svg" alt="Little Herb Garden logo" width="48" height="48">
        </a>
        <p class="site-name">The Little Herb Garden</p>
        <nav aria-label="Site Navigation">
            <ul>
                <li><a href="index.html#herbs">All Herbs</a></li>
                <li><a href="index.html#visit">Visit</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="herb-detail-container">
        <nav class="breadcrumb" aria-label="Breadcrumbs">
            <a href="index.html">← Back to all herbs</a>
        </nav>

        <article id="herb-detail" class="herb-article" aria-busy="true">
            <header class="herb-header">
                <!-- Accessible inline SVG icon -->
                <svg class="herb-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
                </svg>
                <div>
                    <h1 id="herb-name">Loading…</h1>
                    <p id="herb-latin" class="latin-name"></p>
                </div>
            </header>

            <section class="herb-info-grid" aria-label="Herb properties">
                <div class="info-card">
                    <h2>Culinary & Practical Use</h2>
                    <p id="herb-use"></p>
                </div>
                <div class="info-card">
                    <h2>Life Cycle</h2>
                    <p id="herb-life"></p>
                </div>
            </section>
        </article>
    </main>

    <footer>
        <p>Made with HTML, CSS and JavaScript.</p>
    </footer>
</body>
</html>
